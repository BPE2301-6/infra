version: "3.9"

services:

  # ============================
  #          BACKEND
  # ============================
  backend:
    image: ghcr.io/bpe2301-6/backend:latest
    container_name: backend
    restart: always
    env_file:
      - .env
    expose:
      - "${BACKEND_PORT}"
    networks:
      - web
      - monitoring
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE}"
        max-file: "${LOG_MAX_FILE}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${BACKEND_PORT}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s


  # ============================
  #            NGINX
  # ============================
  nginx:
    container_name: nginx
    restart: always
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "${NGINX_PORT}:80"
    networks:
      - web
    volumes:
      - ${FRONTEND_DIST}:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE}"
        max-file: "${LOG_MAX_FILE}"


  # ============================
  #         PROMETHEUS
  # ============================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "${PROMETHEUS_PORT}:9090"
    depends_on:
      - backend


  # ============================
  #           GRAFANA
  # ============================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana


  # ============================
  #             LOKI
  # ============================
  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    restart: always
    networks:
      - monitoring
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml


  # ============================
  #           PROMTAIL
  # ============================
  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    restart: always
    depends_on:
      - loki
    networks:
      - monitoring
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yaml:/etc/promtail/config.yaml


# ============================
#          NETWORKS
# ============================
networks:
  web:
    driver: bridge
  monitoring:
    driver: bridge


# ============================
#          VOLUMES
# ============================
volumes:
  grafana-data:
