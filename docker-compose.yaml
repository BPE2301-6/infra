---
services:
  backend:
    image: ghcr.io/bpe2301-6/backend:latest
    container_name: backend
    restart: always
    env_file:
      - .env
    expose:
      - "${BACKEND_PORT}"
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE}"
        max-file: "${LOG_MAX_FILE}"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
  nginx:
    container_name: nginx
    restart: always
    depends_on:
      - backend
    env_file:
      - .env
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ${FRONTEND_DIST}:/usr/share/nginx/html:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - web
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE}"
        max-file: "${LOG_MAX_FILE}"

networks:
  web:
    driver: bridge
