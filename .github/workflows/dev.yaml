name: Deploy Monitoring to Dev

on:
  push:
    branches:
      - dev
    paths:
      - "docker-compose.monitoring.yaml"
      - "prometheus.yml"
      - "loki-config.yaml"
      - "promtail-config.yaml"
      - "grafana/**"
      - ".github/workflows/dev-monitoring.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-monitoring-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Notify Start
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            📈 **Деплой monitoring на dev**
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ github.ref }}`

      - name: Install SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.DEV_SSH_PORT }} -H ${{ secrets.DEV_SSH_HOST }} > ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh -A -p ${{ secrets.DEV_SSH_PORT }} ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }} << 'EOF'
          set -e

          cd "${{ secrets.DEV_INFRA_DIR }}"
          echo "pwd: $(pwd)"

          echo "===> update infra repo (dev)"
          git fetch origin
          git checkout dev
          git reset --hard origin/dev

          if [ ! -f ".env.dev" ]; then
            echo ".env.dev not found in $(pwd) — создай его на сервере"
            exit 1
          fi

          export DOCKER_BUILDKIT=1

          docker compose -f docker-compose.monitoring.yaml --env-file .env.dev up -d --build

          docker compose -f docker-compose.monitoring.yaml ps || true

          EOF

      - name: Notify Success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ✅ **Monitoring dev обновлен**
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ github.ref }}`

      - name: Notify Failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ❌ **Monitoring dev деплой упал**
            Репозиторий: `${{ github.repository }}`
            Ветка: `${{ github.ref }}`
            🔗 [Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Cleanup
        run: rm -rf ~/.ssh
